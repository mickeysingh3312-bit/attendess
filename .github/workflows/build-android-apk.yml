name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/build-android-apk.yml"
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Attendance mobile API URL, ending in /api/mobile"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: attendance-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate clean Android scaffold
        run: |
          set -euo pipefail
          rm -rf /tmp/five_star_attendance_android
          flutter create --platforms=android --org au.com.fivestaraccess --project-name five_star_attendance /tmp/five_star_attendance_android
          rm -rf mobile/android
          cp -R /tmp/five_star_attendance_android/android mobile/android
          python3 mobile/tool/prepare_android.py

      - name: Install Flutter packages
        working-directory: mobile
        run: flutter pub get

      - name: Analyze mobile source
        working-directory: mobile
        run: flutter analyze --no-fatal-infos

      - name: Build release APK
        working-directory: mobile
        env:
          ATTENDANCE_API_BASE_URL: ${{ inputs.api_base_url || vars.ATTENDANCE_API_BASE_URL }}
        run: |
          set -euo pipefail
          API_URL="${ATTENDANCE_API_BASE_URL:-https://attendance.example.com/api/mobile}"
          flutter build apk --release --dart-define=API_BASE_URL="$API_URL"

      - name: Android launch smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r mobile/build/app/outputs/flutter-apk/app-release.apk
            adb logcat -c
            adb shell am force-stop au.com.fivestaraccess.five_star_attendance || true
            adb shell am start -W -n au.com.fivestaraccess.five_star_attendance/.MainActivity
            sleep 10
            test -n "$(adb shell pidof au.com.fivestaraccess.five_star_attendance | tr -d '\r' || true)" || { echo "App process exited after launch"; adb logcat -d -v time | grep -E "FATAL EXCEPTION|AndroidRuntime|five_star_attendance|flutter" | tail -n 250 || true; exit 1; }
            adb shell dumpsys activity activities | grep -q au.com.fivestaraccess.five_star_attendance || { echo "App activity is not present after launch"; adb logcat -d -v time | grep -E "FATAL EXCEPTION|AndroidRuntime|five_star_attendance|flutter" | tail -n 250 || true; exit 1; }
            echo "Runtime startup smoke test passed."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: five-star-attendance-clean-v0.4.2
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
