name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/build-android-apk.yml"
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Attendance mobile API URL, ending in /api/mobile"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: attendance-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android scaffold
        run: |
          set -euo pipefail
          rm -rf /tmp/five_star_attendance_android
          flutter create --platforms=android --org au.com.fivestaraccess --project-name five_star_attendance /tmp/five_star_attendance_android
          rm -rf mobile/android
          cp -R /tmp/five_star_attendance_android/android mobile/android
          python3 mobile/tool/prepare_android.py

      - name: Install Flutter packages
        working-directory: mobile
        run: flutter pub get

      - name: Analyze mobile source
        working-directory: mobile
        run: flutter analyze

      - name: Build release APK
        working-directory: mobile
        env:
          ATTENDANCE_API_BASE_URL: ${{ inputs.api_base_url || vars.ATTENDANCE_API_BASE_URL }}
        run: |
          set -euo pipefail
          API_URL="${ATTENDANCE_API_BASE_URL:-https://attendance.example.com/api/mobile}"
          flutter build apk --release --dart-define=API_BASE_URL="$API_URL"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: five-star-attendance-otp-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
