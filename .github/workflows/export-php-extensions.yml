name: Export PHP Extensions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/export-php-extensions.yml"

permissions:
  contents: read

jobs:
  extensions:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring,pdo_sqlite,sqlite3,dom,xml
          coverage: none
      - name: Collect extensions
        run: |
          set -euo pipefail
          EXT_DIR="$(php-config --extension-dir)"
          mkdir -p /tmp/php-ext
          for ext in mbstring pdo_sqlite sqlite3 dom xml; do
            SRC="$EXT_DIR/$ext.so"
            if [ -f "$SRC" ]; then cp "$SRC" /tmp/php-ext/; fi
          done
          php -v > /tmp/php-ext/php-version.txt
          php -m > /tmp/php-ext/php-modules.txt
          ls -lah /tmp/php-ext
      - name: Upload extensions
        uses: actions/upload-artifact@v4
        with:
          name: php84-local-test-extensions
          path: /tmp/php-ext
          if-no-files-found: error
          retention-days: 1
